# ============================================================
# Nginx 反向代理配置（用于 my-space 个人网站）
# 保存到 /etc/nginx/sites-available/my-space
# 然后创建软链接: ln -s /etc/nginx/sites-available/my-space /etc/nginx/sites-enabled/
# ============================================================

server {
    listen 80;
    server_name dazyz.art www.dazyz.art;

    # 日志
    access_log /var/log/nginx/my-space-access.log;
    error_log /var/log/nginx/my-space-error.log;

    # 上传文件大小限制
    client_max_body_size 10M;

    # 反向代理到 Node.js 应用
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 静态资源缓存（1年）
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
