<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周珩 · CL-c816</title>
<meta name="description" content="周珩（CL-c816）的个人页面 —— 博客、开源仓库与学习记录。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>周</text></svg>">
<style>
  :root{
    --bg:#f8fafc; --surface:#ffffff; --border:#e2e8f0;
    --text:#0f172a; --muted:#64748b;
    --accent:#1d4ed8; --accent-soft:#eff6ff; --accent-line:#bfdbfe;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f172a; --surface:#1e293b; --border:#334155;
      --text:#e2e8f0; --muted:#94a3b8;
      --accent:#93c5fd; --accent-soft:#1e293b; --accent-line:#1e40af;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); line-height:1.7;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px; margin:0 auto; padding:72px 24px 56px}
  .name{font-size:30px; font-weight:600; letter-spacing:-.02em; margin:0 0 6px}
  .handle{color:var(--muted); font-size:14px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin:0 0 20px}
  .bio{margin:0 0 32px; font-size:16px; color:var(--text); opacity:.9}
  .links{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:48px}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:10px; font-size:14px; font-weight:500;
    text-decoration:none; border:1px solid var(--accent-line);
    background:var(--accent-soft); color:var(--accent);
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:hover{transform:translateY(-1px); opacity:.85}
  h2{
    font-size:13px; font-weight:500; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:0 0 16px;
  }
  .repos{display:grid; gap:12px; margin-bottom:48px}
  .repo{
    display:block; text-decoration:none; color:inherit;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:16px 18px;
    transition:border-color .15s ease, transform .12s ease;
  }
  .repo:hover{border-color:var(--accent-line); transform:translateY(-1px)}
  .repo-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:15px; font-weight:500; margin-bottom:4px}
  .repo-desc{font-size:13.5px; color:var(--muted); margin:0}
  footer{
    border-top:1px solid var(--border); padding-top:20px;
    font-size:13px; color:var(--muted);
    display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between;
  }
  footer a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--border)}
  footer a:hover{color:var(--accent); border-bottom-color:var(--accent)}
  @media (max-width:480px){
    .wrap{padding:48px 20px 40px}
    .name{font-size:25px}
  }
</style>
</head>
<body>
<main class="wrap">

  <h1 class="name">周珩</h1>
  <p class="handle">CL-c816</p>
  <p class="bio">网络安全 · 网络工程 · Linux。平时写点东西，也把踩过的坑记下来。</p>

  <nav class="links">
    <a class="btn" href="https://dazyz.art" target="_blank" rel="noopener">博客</a>
    <a class="btn" href="https://github.com/CL-c816" target="_blank" rel="noopener">GitHub</a>
  </nav>

  <h2>仓库</h2>
  <div class="repos">
    <a class="repo" href="https://github.com/CL-c816/person-blog" target="_blank" rel="noopener">
      <div class="repo-name">person-blog</div>
      <p class="repo-desc">个人博客系统源码</p>
    </a>
    <a class="repo" href="https://github.com/CL-c816/linutest" target="_blank" rel="noopener">
      <div class="repo-name">linutest</div>
      <p class="repo-desc">Linux 学习与实验记录</p>
    </a>
    <a class="repo" href="https://github.com/CL-c816/community" target="_blank" rel="noopener">
      <div class="repo-name">community</div>
      <p class="repo-desc">博客评论区存储</p>
    </a>
  </div>

  <footer>
    <span>© 2026 CL-c816</span>
    <span>由 <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a> 托管</span>
  </footer>

</main>
</body>
</html>
